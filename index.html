<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>機甲充能站 - 心算邏輯特訓</title>
    <style>
        :root {
            --bg-color: #1a252f;
            --card-bg: #2c3e50;
            --accent-cyan: #00cec9;
            --accent-yellow: #f1c40f;
            --text-color: #ffffff;
            --btn-bg: #ecf0f1;
            --btn-text: #2c3e50;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body {
            font-family: "Chalkboard SE", "Comic Sans MS", "微軟正黑體", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            overflow: hidden;
        }

        /* 頂級容器：支援 100dvh 防遮擋與 Safe-Area */
        .app-container {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 10px 15px;
            padding-bottom: max(12px, env(safe-area-inset-bottom));
            box-sizing: border-box;
            position: relative;
        }

        /* 頂部 HUD 資訊列 */
        .hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            padding: 6px 12px;
            border-radius: 12px;
            backdrop-filter: blur(5px);
        }

        .hud-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
        }

        .hud-status {
            font-size: 0.95rem;
            font-weight: bold;
            color: var(--accent-yellow);
        }

        .progress-text {
            text-align: center;
            font-size: 0.9rem;
            color: var(--accent-yellow);
            font-weight: bold;
            margin: 4px 0 2px 0;
        }

        /* 主遊戲區域：縮減垂直邊距 */
        .main-game-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            width: 100%;
            min-height: 0; /* 防止子元素撐爆 Flex 容器 */
        }

        /* 機甲角色圖案：適度縮小避免擠壓 */
        .robot-avatar {
            font-size: 3.5rem;
            line-height: 1;
            margin-bottom: 5px;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
            animation: floatRobot 2.5s ease-in-out infinite;
        }

        @keyframes floatRobot {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        /* 直式算式卡片：調優內邊距與邊框 */
        .math-card {
            background: #0f171e;
            border: 3px solid var(--accent-cyan);
            border-radius: 16px;
            padding: 12px 35px;
            text-align: right;
            box-shadow: 0 8px 20px rgba(0, 206, 201, 0.2);
            position: relative;
            margin-bottom: 10px;
            min-width: 180px;
        }

        .math-num {
            font-size: 2.2rem;
            font-weight: bold;
            letter-spacing: 2px;
            line-height: 1.2;
            color: #fff;
        }

        .math-line {
            width: 100%;
            height: 3px;
            background-color: var(--accent-yellow);
            margin: 4px 0;
        }

        .math-operator {
            position: absolute;
            left: 15px;
            bottom: 42px;
            font-size: 1.8rem;
            color: var(--accent-yellow);
            font-weight: bold;
        }

        /* 底部選項按鈕區：完美符合雙欄且不遮擋 */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            width: 100%;
            margin-top: auto;
        }

        .opt-btn {
            background: var(--btn-bg);
            border: none;
            border-bottom: 5px solid #bdc3c7;
            border-radius: 16px;
            padding: 14px 0;
            font-size: 1.6rem;
            font-weight: bold;
            color: var(--btn-text);
            cursor: pointer;
            transition: all 0.08s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .opt-btn:active {
            transform: translateY(3px);
            border-bottom-width: 2px;
            background: #dcdde1;
        }

        .opt-btn.correct {
            background: #2ecc71 !important;
            border-color: #27ae60 !important;
            color: #fff !important;
        }

        .opt-btn.wrong {
            background: #e74c3c !important;
            border-color: #c0392b !important;
            color: #fff !important;
        }

        /* Modal 通用蓋板 */
        .modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 30, 0.9);
            backdrop-filter: blur(5px);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .modal-card {
            background: var(--card-bg);
            border: 3px solid var(--accent-cyan);
            border-radius: 20px;
            padding: 20px;
            width: 85%;
            max-width: 320px;
            text-align: center;
        }

        .start-btn {
            background: linear-gradient(135deg, #00cec9, #0984e3);
            border: none;
            border-bottom: 4px solid #0056b3;
            color: #fff;
            font-size: 1.2rem;
            font-weight: bold;
            padding: 12px 25px;
            border-radius: 50px;
            margin-top: 15px;
            cursor: pointer;
            width: 100%;
        }

        .start-btn:active {
            transform: translateY(2px);
            border-bottom-width: 2px;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- 頂部 HUD -->
        <div class="hud">
            <button class="hud-btn" onclick="togglePause()">⏸️ 選單</button>
            <div class="hud-status">Score: <span id="score-text">0</span></div>
        </div>

        <div class="progress-text">進度：<span id="current-q-num">1</span> / 25</div>

        <!-- 主遊戲區域 -->
        <div class="main-game-area">
            <div class="robot-avatar">🤖</div>

            <!-- 直式算式卡片 -->
            <div class="math-card">
                <div class="math-operator" id="operator-text">-</div>
                <div class="math-num" id="num-top">76</div>
                <div class="math-num" id="num-bottom">13</div>
                <div class="math-line"></div>
                <div class="math-num" style="color: var(--accent-yellow);">?</div>
            </div>
        </div>

        <!-- 4 個選項區域 -->
        <div class="options-grid" id="options-grid"></div>

        <!-- 結算/暫停 Modal -->
        <div id="game-modal" class="modal hidden">
            <div class="modal-card">
                <div style="font-size: 3.5rem; margin-bottom: 10px;" id="modal-icon">🤖</div>
                <h2 id="modal-title" style="color:var(--accent-cyan); margin: 5px 0;">機甲充能完成</h2>
                <p id="modal-desc" style="color:#ccc; font-size:0.95rem; margin-bottom:15px;">本次訓練得分：0</p>
                <button class="start-btn" onclick="startGame()">開始新特訓 ⚡</button>
            </div>
        </div>
    </div>

    <script>
        let currentQuestion = 0;
        let totalQuestions = 25;
        let score = 0;
        let correctAnswer = 0;
        let isAnsweringLocked = false;

        function generateQuestion() {
            isAnsweringLocked = false;
            const isAddition = Math.random() > 0.5;
            let top, bottom;

            if (isAddition) {
                top = Math.floor(Math.random() * 50) + 10;
                bottom = Math.floor(Math.random() * 40) + 5;
                correctAnswer = top + bottom;
                document.getElementById('operator-text').innerText = '+';
            } else {
                top = Math.floor(Math.random() * 60) + 20;
                bottom = Math.floor(Math.random() * (top - 5)) + 5;
                correctAnswer = top - bottom;
                document.getElementById('operator-text').innerText = '-';
            }

            document.getElementById('num-top').innerText = top;
            document.getElementById('num-bottom').innerText = bottom;
            document.getElementById('current-q-num').innerText = currentQuestion + 1;

            generateOptions();
        }

        function generateOptions() {
            const grid = document.getElementById('options-grid');
            grid.innerHTML = '';

            let options = [correctAnswer];
            while (options.length < 4) {
                let offset = (Math.floor(Math.random() * 5) + 1) * (Math.random() > 0.5 ? 1 : -1);
                let wrongOpt = correctAnswer + offset;
                if (wrongOpt > 0 && !options.includes(wrongOpt)) {
                    options.push(wrongOpt);
                }
            }

            options.sort(() => Math.random() - 0.5);

            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'opt-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(opt, btn);
                grid.appendChild(btn);
            });
        }

        function checkAnswer(selected, btn) {
            if (isAnsweringLocked) return;

            if (selected === correctAnswer) {
                isAnsweringLocked = true;
                btn.classList.add('correct');
                score += 10;
                document.getElementById('score-text').innerText = score;

                setTimeout(() => {
                    currentQuestion++;
                    if (currentQuestion >= totalQuestions) {
                        endGame();
                    } else {
                        generateQuestion();
                    }
                }, 400);
            } else {
                btn.classList.add('wrong');
                setTimeout(() => btn.classList.remove('wrong'), 600);
            }
        }

        function togglePause() {
            document.getElementById('modal-icon').innerText = "⏸️";
            document.getElementById('modal-title').innerText = "特訓暫停中";
            document.getElementById('modal-desc').innerText = `目前進度：${currentQuestion + 1} / ${totalQuestions}`;
            document.getElementById('game-modal').classList.remove('hidden');
        }

        function endGame() {
            document.getElementById('modal-icon').innerText = "🏆";
            document.getElementById('modal-title').innerText = "充能特訓完成！";
            document.getElementById('modal-desc').innerText = `最終獲得總分：${score} 分`;
            document.getElementById('game-modal').classList.remove('hidden');
        }

        function startGame() {
            currentQuestion = 0;
            score = 0;
            document.getElementById('score-text').innerText = '0';
            document.getElementById('game-modal').classList.add('hidden');
            generateQuestion();
        }

        // 初始化第一次題目
        generateQuestion();
    </script>
</body>
</html>
