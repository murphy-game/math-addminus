<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>機甲充能站 - 心算邏輯特訓 ⚡</title>
    <style>
        :root {
            --bg-color: #1a252f;
            --card-bg: rgba(44, 62, 80, 0.9);
            --accent-cyan: #00cec9;
            --accent-yellow: #f1c40f;
            --text-color: #ffffff;
            --btn-bg: #ecf0f1;
            --btn-text: #2c3e50;
        }

        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: manipulation; }

        body {
            font-family: "Chalkboard SE", "Comic Sans MS", "微軟正黑體", sans-serif;
            background-color: var(--bg-color);
            background-image: url('bg.png');
            background-size: cover;
            background-position: center;
            color: var(--text-color);
            margin: 0; padding: 0; display: flex; justify-content: center; align-items: center;
            min-height: 100vh; min-height: 100dvh; overflow: hidden;
        }

        .app-container {
            width: 100%; max-width: 420px; height: 100vh; height: 100dvh;
            display: flex; flex-direction: column; justify-content: space-between;
            padding: 10px 15px; padding-bottom: max(12px, env(safe-area-inset-bottom)); position: relative;
        }

        .hud {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(15, 23, 30, 0.85); padding: 6px 12px; border-radius: 12px;
            backdrop-filter: blur(5px); border: 1px solid rgba(0, 206, 201, 0.3);
        }
        .hud-btn-group { display: flex; gap: 6px; }
        .hud-icon-btn {
            background: rgba(255, 255, 255, 0.15); border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff; width: 34px; height: 34px; border-radius: 50%; font-size: 0.95rem;
            cursor: pointer; display: flex; justify-content: center; align-items: center;
        }

        .score-box { text-align: right; }
        .score-box div { font-size: 0.65rem; color: #ccc; }
        .score-box span { font-size: 0.95rem; font-weight: bold; color: var(--accent-yellow); }

        .progress-text {
            text-align: center; font-size: 0.85rem; color: var(--accent-yellow); font-weight: bold; margin: 4px 0;
            background: rgba(0,0,0,0.5); padding: 3px 10px; border-radius: 20px; align-self: center;
        }

        .main-game-area {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            flex: 1; width: 100%; min-height: 0; position: relative;
        }

        .robot-stage {
            position: relative; width: 130px; height: 130px;
            display: flex; justify-content: center; align-items: center; margin-bottom: 5px;
        }
        .robot-img {
            max-width: 100%; max-height: 100%; object-fit: contain;
            filter: drop-shadow(0 6px 12px rgba(0, 206, 201, 0.4));
            animation: floatRobot 2.5s ease-in-out infinite;
        }
        @keyframes floatRobot { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

        .boom-effect {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0);
            width: 160px; height: 160px; pointer-events: none; opacity: 0; z-index: 10;
            transition: all 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex; justify-content: center; align-items: center;
        }
        .boom-effect.active {
            transform: translate(-50%, -50%) scale(1.2); opacity: 1;
        }

        .math-card {
            background: rgba(15, 23, 30, 0.9); border: 3px solid var(--accent-cyan);
            border-radius: 16px; padding: 10px 35px; text-align: right;
            box-shadow: 0 8px 20px rgba(0, 206, 201, 0.3); position: relative; margin-bottom: 8px; min-width: 180px;
        }
        .math-num { font-size: 2.2rem; font-weight: bold; letter-spacing: 2px; line-height: 1.2; color: #fff; }
        .math-line { width: 100%; height: 3px; background-color: var(--accent-yellow); margin: 4px 0; }
        .math-operator { position: absolute; left: 15px; bottom: 42px; font-size: 1.8rem; color: var(--accent-yellow); font-weight: bold; }

        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; margin-top: auto; }
        .opt-btn {
            background: var(--btn-bg); border: none; border-bottom: 5px solid #bdc3c7;
            border-radius: 16px; padding: 14px 0; font-size: 1.6rem; font-weight: bold;
            color: var(--btn-text); cursor: pointer; transition: all 0.08s ease;
            display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .opt-btn:active { transform: translateY(3px); border-bottom-width: 2px; background: #dcdde1; }
        .opt-btn.correct { background: #2ecc71 !important; color: #fff !important; border-color: #27ae60 !important; }
        .opt-btn.wrong { background: #e74c3c !important; color: #fff !important; border-color: #c0392b !important; }

        .modal {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 30, 0.92); backdrop-filter: blur(6px);
            z-index: 100; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px;
        }
        .modal-card {
            background: var(--card-bg); border: 3px solid var(--accent-cyan);
            border-radius: 20px; padding: 20px; width: 85%; max-width: 320px; text-align: center;
            box-shadow: 0 10px 30px rgba(0, 206, 201, 0.3);
        }
        .menu-btn {
            background: transparent; border: 2px solid var(--accent-cyan);
            color: white; padding: 12px 20px; margin: 8px 0; font-size: 1.1rem; font-weight: bold;
            border-radius: 50px; cursor: pointer; width: 100%; transition: all 0.2s;
        }
        .menu-btn:active { transform: scale(0.95); background: var(--accent-cyan); color: #000; }
        .level-tag { font-size: 0.8rem; opacity: 0.8; display: block; margin-top: 2px; color: var(--accent-yellow); }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="hud">
            <div class="hud-btn-group">
                <button class="hud-icon-btn" id="sound-btn" onclick="toggleSound()">🔊</button>
                <button class="hud-icon-btn" id="vibrate-btn" onclick="toggleVibrate()">📳</button>
                <button class="hud-icon-btn" onclick="openLevelSelect()">⚙️</button>
                <button class="hud-icon-btn" onclick="togglePause()">⏸️</button>
            </div>
            <div class="score-box">
                <div>BEST: <span id="high-score">0</span></div>
                <div>SCORE: <span id="score">0</span></div>
            </div>
        </div>

        <div class="progress-text">進度：<span id="current-q-num">1</span> / 25</div>

        <div class="main-game-area">
            <div class="robot-stage">
                <img src="hero.png" id="robot-hero-img" class="robot-img" onerror="this.style.display='none'; document.getElementById('emoji-robot').style.display='block';">
                <span id="emoji-robot" style="font-size:4.5rem; display:none;">🤖</span>

                <div id="boom-box" class="boom-effect">
                    <img src="boom.png" style="width:100%; height:100%; object-fit:contain;" onerror="this.style.display='none'; document.getElementById('emoji-boom').style.display='block';">
                    <span id="emoji-boom" style="font-size:4rem; display:none;">💥</span>
                </div>
            </div>

            <div class="math-card">
                <div class="math-operator" id="operator-text">-</div>
                <div class="math-num" id="num-top">76</div>
                <div class="math-num" id="num-bottom">13</div>
                <div class="math-line"></div>
                <div class="math-num" style="color: var(--accent-yellow);">?</div>
            </div>
        </div>

        <div class="options-grid" id="options-grid"></div>

        <div id="level-modal" class="modal">
            <div class="modal-card">
                <div style="height: 80px; display:flex; justify-content:center; align-items:center; margin-bottom:10px;">
                    <img src="hero.png" style="max-height:100%; object-fit:contain;" onerror="this.style.display='none'; document.getElementById('modal-emoji').style.display='block';">
                    <span id="modal-emoji" style="font-size:3.5rem; display:none;">🤖</span>
                </div>
                <h2 style="color:var(--accent-cyan); margin: 5px 0;">加減法速算特訓</h2>
                <p style="color:#ccc; font-size:0.85rem; margin-bottom:12px;">請選擇訓練難度</p>
                <button class="menu-btn" onclick="selectDifficulty(1)">🟢 見習駕駛 <span class="level-tag">20 以內加減 (入門)</span></button>
                <button class="menu-btn" onclick="selectDifficulty(2)">🟡 正式隊員 <span class="level-tag">50 以內加減 (基礎)</span></button>
                <button class="menu-btn" onclick="selectDifficulty(3)">🔴 王牌機師 <span class="level-tag">100 以內加減 (進階)</span></button>
            </div>
        </div>

        <div id="game-modal" class="modal hidden">
            <div class="modal-card">
                <div style="height: 100px; display:flex; justify-content:center; align-items:center; margin-bottom:10px;">
                    <img src="energy.png" id="modal-result-img" style="max-height:100%; object-fit:contain;" onerror="this.style.display='none'; document.getElementById('modal-icon-emoji').style.display='block';">
                    <span id="modal-icon-emoji" style="font-size:3.5rem; display:none;">⚡</span>
                </div>
                <h2 id="modal-title" style="color:var(--accent-cyan); margin: 5px 0;">充能完成</h2>
                <p id="modal-desc" style="color:#ccc; font-size:0.9rem; margin-bottom:15px;">本次得分：0</p>
                <button class="menu-btn" style="background:var(--accent-cyan); color:#000;" onclick="openLevelSelect()">重新選擇難度 ⚡</button>
            </div>
        </div>
    </div>

    <script>
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;
        let soundEnabled = true, vibrateEnabled = true;

        function initAudio() { if (!audioCtx) audioCtx = new AudioContext(); if (audioCtx.state === 'suspended') audioCtx.resume(); }
        function triggerVibrate(ms = 40) { if (vibrateEnabled && navigator.vibrate) navigator.vibrate(ms); }

        function playSound(type) {
            if (!soundEnabled) return; initAudio(); if (!audioCtx) return;
            const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'correct') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(523.25, now); osc.frequency.setValueAtTime(659.25, now + 0.08);
                gain.gain.setValueAtTime(0.15, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
                osc.start(now); osc.stop(now + 0.2);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(220, now); osc.frequency.linearRampToValueAtTime(110, now + 0.25);
                gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
                osc.start(now); osc.stop(now + 0.25);
            }
        }

        function toggleSound() { soundEnabled = !soundEnabled; document.getElementById('sound-btn').innerText = soundEnabled ? '🔊' : '🔇'; }
        function toggleVibrate() { vibrateEnabled = !vibrateEnabled; document.getElementById('vibrate-btn').innerText = vibrateEnabled ? '📳' : '📴'; if (vibrateEnabled) triggerVibrate(30); }

        let currentDifficulty = 1;
        let currentQuestion = 0, totalQuestions = 25, score = 0;
        let highScore = parseInt(localStorage.getItem('addminus_high_score')) || 0;
        let correctAnswer = 0, isAnsweringLocked = false;
        let questionPool = []; // 洗牌不放回題庫

        function selectDifficulty(diff) {
            currentDifficulty = diff;
            document.getElementById('level-modal').classList.add('hidden');
            startGame();
        }

        function openLevelSelect() {
            document.getElementById('game-modal').classList.add('hidden');
            document.getElementById('level-modal').classList.remove('hidden');
        }

        // 生成當前難度下的完整題庫並打亂（絕不重複）
        function buildQuestionPool() {
            const raw = [];
            let maxLimit = currentDifficulty === 1 ? 20 : (currentDifficulty === 2 ? 50 : 100);
            
            // 隨機生成 100 題候選算式
            while (raw.length < 80) {
                const isAdd = Math.random() > 0.5;
                let top, bottom, ans;
                if (isAdd) {
                    top = Math.floor(Math.random() * (maxLimit / 2)) + 1;
                    bottom = Math.floor(Math.random() * (maxLimit / 2)) + 1;
                    ans = top + bottom;
                } else {
                    top = Math.floor(Math.random() * (maxLimit - 5)) + 5;
                    bottom = Math.floor(Math.random() * (top - 1)) + 1;
                    ans = top - bottom;
                }
                const key = `${top}_${isAdd ? '+' : '-'}_${bottom}`;
                if (!raw.some(item => item.key === key)) {
                    raw.push({ top, bottom, isAdd, ans, key });
                }
            }
            // 打亂題庫
            questionPool = raw.sort(() => Math.random() - 0.5);
        }

        function generateQuestion() {
            isAnsweringLocked = false;
            if (questionPool.length === 0) buildQuestionPool();

            const q = questionPool.pop();
            correctAnswer = q.ans;

            document.getElementById('operator-text').innerText = q.isAdd ? '+' : '-';
            document.getElementById('num-top').innerText = q.top;
            document.getElementById('num-bottom').innerText = q.bottom;
            document.getElementById('current-q-num').innerText = currentQuestion + 1;
            generateOptions();
        }

        function generateOptions() {
            const grid = document.getElementById('options-grid'); grid.innerHTML = '';
            let options = [correctAnswer];
            while (options.length < 4) {
                let offset = (Math.floor(Math.random() * 4) + 1) * (Math.random() > 0.5 ? 1 : -1);
                let wrongOpt = correctAnswer + offset;
                if (wrongOpt > 0 && !options.includes(wrongOpt)) options.push(wrongOpt);
            }
            options.sort(() => Math.random() - 0.5);
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'opt-btn'; btn.innerText = opt;
                btn.onclick = () => checkAnswer(opt, btn);
                grid.appendChild(btn);
            });
        }

        function triggerBoomEffect() {
            const boom = document.getElementById('boom-box');
            boom.classList.add('active');
            setTimeout(() => boom.classList.remove('active'), 350);
        }

        function checkAnswer(selected, btn) {
            if (isAnsweringLocked) return;
            if (selected === correctAnswer) {
                isAnsweringLocked = true; btn.classList.add('correct');
                playSound('correct'); triggerVibrate(40);
                triggerBoomEffect();

                score += 10; document.getElementById('score').innerText = score;
                setTimeout(() => {
                    currentQuestion++;
                    if (currentQuestion >= totalQuestions) endGame();
                    else generateQuestion();
                }, 400);
            } else {
                btn.classList.add('wrong'); playSound('wrong'); triggerVibrate(100);
                setTimeout(() => btn.classList.remove('wrong'), 600);
            }
        }

        function togglePause() {
            const resultImg = document.getElementById('modal-result-img');
            const fallbackEmoji = document.getElementById('modal-icon-emoji');
            resultImg.src = 'hero.png'; resultImg.style.display = 'block';
            fallbackEmoji.innerText = "🤖"; fallbackEmoji.style.display = 'none';

            document.getElementById('modal-title').innerText = "特訓暫停中";
            document.getElementById('modal-desc').innerText = `當前進度：${currentQuestion + 1} / ${totalQuestions}`;
            document.getElementById('game-modal').classList.remove('hidden');
        }

        function endGame() {
            let isNewHigh = false;
            if (score > highScore) { highScore = score; localStorage.setItem('addminus_high_score', highScore); isNewHigh = true; }
            
            const resultImg = document.getElementById('modal-result-img');
            const fallbackEmoji = document.getElementById('modal-icon-emoji');
            resultImg.style.display = 'block'; fallbackEmoji.style.display = 'none';

            if (score >= 180) { resultImg.src = 'energy.png'; fallbackEmoji.innerText = "⚡"; }
            else { resultImg.src = 'lose.png'; fallbackEmoji.innerText = "💥"; }

            document.getElementById('modal-title').innerText = isNewHigh ? "🎉 突破新紀錄！" : (score >= 180 ? "⚡ 充能成功！" : "💥 機甲過熱！");
            document.getElementById('modal-desc').innerText = `最終得分：${score} (最高紀錄: ${highScore})`;
            document.getElementById('game-modal').classList.remove('hidden');
            updateScoreUI();
        }

        function startGame() {
            initAudio(); currentQuestion = 0; score = 0;
            buildQuestionPool();
            updateScoreUI();
            document.getElementById('game-modal').classList.add('hidden');
            generateQuestion();
        }

        function updateScoreUI() {
            document.getElementById('score').innerText = score;
            document.getElementById('high-score').innerText = highScore;
        }

        updateScoreUI();
    </script>
</body>
</html>
