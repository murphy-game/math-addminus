<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>機甲充能站 - 心算邏輯特訓 ⚡</title>
    <style>
        :root {
            --bg-color: #1a252f;
            --card-bg: rgba(44, 62, 80, 0.9);
            --accent-cyan: #00cec9;
            --accent-yellow: #f1c40f;
            --text-color: #ffffff;
            --btn-bg: #ecf0f1;
            --btn-text: #2c3e50;
            --accent-red: #ff7675;
        }

        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: manipulation; }

        body {
            font-family: "Chalkboard SE", "Comic Sans MS", "微軟正黑體", sans-serif;
            background-color: var(--bg-color);
            background-image: url('bg.png');
            background-size: cover;
            background-position: center;
            color: var(--text-color);
            margin: 0; padding: 0; display: flex; justify-content: center; align-items: center;
            min-height: 100vh; min-height: 100dvh; overflow: hidden;
        }

        .app-container {
            width: 100%; max-width: 420px; height: 100vh; height: 100dvh;
            display: flex; flex-direction: column; justify-content: space-between;
            padding: 10px 15px; padding-bottom: max(12px, env(safe-area-inset-bottom)); position: relative;
        }

        .hud {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(15, 23, 30, 0.85); padding: 6px 12px; border-radius: 12px;
            backdrop-filter: blur(5px); border: 1px solid rgba(0, 206, 201, 0.3);
        }
        .hud-btn-group { display: flex; gap: 6px; }
        .hud-icon-btn {
            background: rgba(255, 255, 255, 0.15); border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff; width: 34px; height: 34px; border-radius: 50%; font-size: 0.95rem;
            cursor: pointer; display: flex; justify-content: center; align-items: center;
        }

        .score-box { text-align: right; }
        .score-box div { font-size: 0.65rem; color: #ccc; }
        .score-box span { font-size: 0.95rem; font-weight: bold; color: var(--accent-yellow); }

        .progress-text {
            text-align: center; font-size: 0.85rem; color: var(--accent-yellow); font-weight: bold; margin: 4px 0;
            background: rgba(0,0,0,0.5); padding: 3px 10px; border-radius: 20px; align-self: center;
        }

        .main-game-area {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            flex: 1; width: 100%; min-height: 0; position: relative;
        }

        .robot-stage {
            position: relative; width: 120px; height: 120px;
            display: flex; justify-content: center; align-items: center; margin-bottom: 5px;
        }
        .robot-img {
            max-width: 100%; max-height: 100%; object-fit: contain;
            filter: drop-shadow(0 6px 12px rgba(0, 206, 201, 0.4));
            animation: floatRobot 2.5s ease-in-out infinite;
        }
        @keyframes floatRobot { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

        /* 爆炸特效容器：移至中央卡片前方，不再遮擋機甲戰士 */
        .boom-effect {
            position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%) scale(0);
            width: 180px; height: 180px; pointer-events: none; opacity: 0; z-index: 20;
            transition: all 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex; justify-content: center; align-items: center;
        }
        .boom-effect.active {
            transform: translate(-50%, -50%) scale(1.2); opacity: 1;
        }

        /* 直式算式卡片 */
        .math-card-vertical {
            background: rgba(15, 23, 30, 0.9); border: 3px solid var(--accent-cyan);
            border-radius: 16px; padding: 10px 35px; text-align: right;
            box-shadow: 0 8px 20px rgba(0, 206, 201, 0.3); position: relative; margin-bottom: 8px; min-width: 180px;
        }
        .math-num { font-size: 2.2rem; font-weight: bold; letter-spacing: 2px; line-height: 1.2; color: #fff; }
        .math-line { width: 100%; height: 3px; background-color: var(--accent-yellow); margin: 4px 0; }
        .math-operator { position: absolute; left: 15px; bottom: 42px; font-size: 1.8rem; color: var(--accent-yellow); font-weight: bold; }

        /* Lv1 橫式算式卡片 */
        .math-card-horizontal {
            background: rgba(15, 23, 30, 0.9); border: 3px solid var(--accent-cyan);
            border-radius: 16px; padding: 12px 20px; text-align: center;
            box-shadow: 0 8px 20px rgba(0, 206, 201, 0.3); margin-bottom: 8px; min-width: 220px;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .horizontal-formula { font-size: 2.3rem; font-weight: bold; letter-spacing: 2px; color: #fff; line-height: 1.2; }
        .speak-btn {
            background: rgba(255, 255, 255, 0.2); border: 1px solid var(--accent-cyan);
            color: #fff; border-radius: 50%; width: 38px; height: 38px; font-size: 1.1rem; cursor: pointer;
            display: flex; justify-content: center; align-items: center; flex-shrink: 0;
        }

        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; margin-top: auto; }
        .opt-btn {
            background: var(--btn-bg); border: none; border-bottom: 5px solid #bdc3c7;
            border-radius: 16px; padding: 14px 0; font-size: 1.6rem; font-weight: bold;
            color: var(--btn-text); cursor: pointer; transition: all 0.08s ease;
            display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .opt-btn:active { transform: translateY(3px); border-bottom-width: 2px; background: #dcdde1; }
        .opt-btn.correct { background: #2ecc71 !important; color: #fff !important; border-color: #27ae60 !important; }
        .opt-btn.wrong { background: #e74c3c !important; color: #fff !important; border-color: #c0392b !important; }

        .modal {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 30, 0.92); backdrop-filter: blur(6px);
            z-index: 100; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px;
        }
        .modal-card {
            background: var(--card-bg); border: 3px solid var(--accent-cyan);
            border-radius: 20px; padding: 20px; width: 85%; max-width: 320px; text-align: center;
            box-shadow: 0 10px 30px rgba(0, 206, 201, 0.3); transition: border-color 0.3s;
        }

        .menu-btn {
            background: transparent; border: 2px solid var(--accent-cyan);
            color: white; padding: 12px 20px; margin: 8px 0; font-size: 1.1rem; font-weight: bold;
            border-radius: 50px; cursor: pointer; width: 100%; transition: all 0.2s;
        }
        .menu-btn:active { transform: scale(0.95); background: var(--accent-cyan); color: #000; }
        .level-tag { font-size: 0.8rem; opacity: 0.8; display: block; margin-top: 2px; color: var(--accent-yellow); }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="hud">
            <div class="hud-btn-group">
                <button class="hud-icon-btn" id="sound-btn" onclick="toggleSound()">🔊</button>
                <button class="hud-icon-btn" id="vibrate-btn" onclick="toggleVibrate()">📳</button>
                <button class="hud-icon-btn" onclick="openLevelSelect()" title="返回選單">🏠</button>
                <button class="hud-icon-btn" onclick="togglePause()">⏸️</button>
            </div>
            <div class="score-box">
                <div>BEST: <span id="high-score">0</span></div>
                <div>SCORE: <span id="score">0</span></div>
            </div>
        </div>

        <div class="progress-text">進度：<span id="current-q-num">1</span> / 25</div>

        <div class="main-game-area">
            <div class="robot-stage">
                <img src="hero.png" id="robot-hero-img" class="robot-img" onerror="this.style.display='none'; document.getElementById('emoji-robot').style.display='block';">
                <span id="emoji-robot" style="font-size:4.5rem; display:none;">🤖</span>
            </div>

            <!-- 爆炸特效：移至卡片區域上方 -->
            <div id="boom-box" class="boom-effect">
                <img src="boom.png" style="width:100%; height:100%; object-fit:contain;" onerror="this.style.display='none'; document.getElementById('emoji-boom').style.display='block';">
                <span id="emoji-boom" style="font-size:4.5rem; display:none;">💥</span>
            </div>

            <!-- Lv1 橫式算式卡片 -->
            <div class="math-card-horizontal" id="horizontal-card">
                <div class="horizontal-formula"><span id="hz-num-top">12</span> <span id="hz-operator">-</span> <span id="hz-num-bottom">5</span> = ?</div>
                <button class="speak-btn" onclick="speakCurrentQuestion()" title="朗讀題目">🔊</button>
            </div>

            <!-- Lv2/Lv3 直式算式卡片 -->
            <div class="math-card-vertical hidden" id="vertical-card">
                <div class="math-num" id="num-top">76</div>
                <div class="math-num" id="num-bottom">28</div>
                <div class="math-line"></div>
                <div class="math-operator" id="operator-text">-</div>
            </div>

            <div class="options-grid" id="options-grid"></div>
        </div>

        <!-- 關卡選擇彈窗 -->
        <div id="level-modal" class="modal">
            <div class="modal-card">
                <h2 style="color:var(--accent-cyan); margin-top:0;">⚡ 選擇特訓難度</h2>
                <button class="menu-btn" onclick="selectLevel(1)">1️⃣ 心算入門 (20以內)<span class="level-tag">橫式語音 / 朗讀發音</span></button>
                <button class="menu-btn" onclick="selectLevel(2)">2️⃣ 直式進階 (兩位數加減)<span class="level-tag">直式退位 / 邏輯特訓</span></button>
                <button class="menu-btn" onclick="selectLevel(3)">3️⃣ 九九乘法表特訓<span class="level-tag">乘法直式 / 基礎熟練</span></button>
            </div>
        </div>

        <!-- 遊戲結果彈窗 -->
        <div id="msg-modal" class="modal hidden">
            <div class="modal-card" id="msg-card">
                <h2 id="msg-title" style="margin-top:0;">標題</h2>
                <p id="msg-body">內容說明</p>
                <button class="menu-btn" onclick="restartGame()">↺ 重新挑戰</button>
                <button class="menu-btn" onclick="openLevelSelect()">🏠 選擇關卡</button>
            </div>
        </div>
    </div>

    <script>
        let currentLevel = 1;
        let score = 0;
        let highScore = parseInt(localStorage.getItem('math_high_score')) || 0;
        let questionCount = 0;
        let maxQuestions = 25;
        let currentQuestion = null;
        let isAnsweringLocked = false;
        let soundEnabled = true;
        let vibrateEnabled = true;

        document.getElementById('high-score').innerText = highScore;

        function selectLevel(lvl) {
            currentLevel = lvl;
            document.getElementById('level-modal').classList.add('hidden');
            restartGame();
        }

        function openLevelSelect() {
            document.getElementById('msg-modal').classList.add('hidden');
            document.getElementById('level-modal').classList.remove('hidden');
        }

        function restartGame() {
            score = 0;
            questionCount = 0;
            isAnsweringLocked = false;
            document.getElementById('score').innerText = score;
            document.getElementById('msg-modal').classList.add('hidden');
            nextQuestion();
        }

        function generateQuestion() {
            let num1, num2, op, ans;
            if (currentLevel === 1) {
                op = Math.random() > 0.5 ? '+' : '-';
                if (op === '+') {
                    num1 = Math.floor(Math.random() * 10) + 1;
                    num2 = Math.floor(Math.random() * 10) + 1;
                    ans = num1 + num2;
                } else {
                    num1 = Math.floor(Math.random() * 15) + 5;
                    num2 = Math.floor(Math.random() * num1) + 1;
                    ans = num1 - num2;
                }
            } else if (currentLevel === 2) {
                op = Math.random() > 0.5 ? '+' : '-';
                if (op === '+') {
                    num1 = Math.floor(Math.random() * 40) + 10;
                    num2 = Math.floor(Math.random() * 40) + 10;
                    ans = num1 + num2;
                } else {
                    num1 = Math.floor(Math.random() * 50) + 30;
                    num2 = Math.floor(Math.random() * (num1 - 10)) + 10;
                    ans = num1 - num2;
                }
            } else {
                op = '×';
                num1 = Math.floor(Math.random() * 9) + 1;
                num2 = Math.floor(Math.random() * 9) + 1;
                ans = num1 * num2;
            }

            let options = [ans];
            while (options.length < 4) {
                let offset = (Math.floor(Math.random() * 5) + 1) * (Math.random() > 0.5 ? 1 : -1);
                let wrongAns = ans + offset;
                if (wrongAns >= 0 && !options.includes(wrongAns)) {
                    options.push(wrongAns);
                }
            }
            options.sort(() => Math.random() - 0.5);

            return { num1, num2, op, ans, options };
        }

        function nextQuestion() {
            if (questionCount >= maxQuestions) {
                showWinModal();
                return;
            }

            questionCount++;
            document.getElementById('current-q-num').innerText = questionCount;
            currentQuestion = generateQuestion();
            isAnsweringLocked = false;

            const hzCard = document.getElementById('horizontal-card');
            const vtCard = document.getElementById('vertical-card');

            if (currentLevel === 1) {
                hzCard.classList.remove('hidden');
                vtCard.classList.add('hidden');
                document.getElementById('hz-num-top').innerText = currentQuestion.num1;
                document.getElementById('hz-operator').innerText = currentQuestion.op;
                document.getElementById('hz-num-bottom').innerText = currentQuestion.num2;
            } else {
                hzCard.classList.add('hidden');
                vtCard.classList.remove('hidden');
                document.getElementById('num-top').innerText = currentQuestion.num1;
                document.getElementById('operator-text').innerText = currentQuestion.op;
                document.getElementById('num-bottom').innerText = currentQuestion.num2;
            }

            const grid = document.getElementById('options-grid');
            grid.innerHTML = '';
            currentQuestion.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'opt-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(opt, btn);
                grid.appendChild(btn);
            });

            if (currentLevel === 1) speakCurrentQuestion();
        }

        function checkAnswer(selectedOpt, btn) {
            if (isAnsweringLocked) return;

            if (selectedOpt === currentQuestion.ans) {
                isAnsweringLocked = true;
                btn.classList.add('correct');
                score += 10;
                document.getElementById('score').innerText = score;
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('math_high_score', highScore);
                    document.getElementById('high-score').innerText = highScore;
                }

                const boom = document.getElementById('boom-box');
                boom.classList.add('active');
                setTimeout(() => boom.classList.remove('active'), 500);

                setTimeout(() => nextQuestion(), 600);
            } else {
                btn.classList.add('wrong');
                if (vibrateEnabled && navigator.vibrate) navigator.vibrate(200);
                setTimeout(() => btn.classList.remove('wrong'), 600);
            }
        }

        function showWinModal() {
            const card = document.getElementById('msg-card');
            card.className = 'modal-card';
            document.getElementById('msg-title').innerHTML = "🎉 特訓完成！";
            document.getElementById('msg-title').style.color = "var(--accent-cyan)";
            document.getElementById('msg-body').innerText = `恭喜完成 25 題心算特訓！最終得分：${score} 分`;
            document.getElementById('msg-modal').classList.remove('hidden');
        }

        function speakCurrentQuestion() {
            if (!soundEnabled || !('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            let text = `${currentQuestion.num1} ${currentQuestion.op === '+' ? '加' : currentQuestion.op === '-' ? '減' : '乘以'} ${currentQuestion.num2} 等於多少？`;
            let utter = new SpeechSynthesisUtterance(text);
            utter.lang = 'zh-TW';
            utter.rate = 0.9;
            window.speechSynthesis.speak(utter);
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            document.getElementById('sound-btn').innerText = soundEnabled ? "🔊" : "🔇";
        }

        function toggleVibrate() {
            vibrateEnabled = !vibrateEnabled;
            document.getElementById('vibrate-btn').innerText = vibrateEnabled ? "📳" : "🔕";
        }

        function togglePause() {
            const card = document.getElementById('msg-card');
            card.className = 'modal-card';
            document.getElementById('msg-title').innerHTML = "⏸️ 遊戲暫停";
            document.getElementById('msg-title').style.color = "var(--accent-yellow)";
            document.getElementById('msg-body').innerText = `當前得分：${score} 分`;
            document.getElementById('msg-modal').classList.remove('hidden');
        }
    </script>
</body>
</html>
